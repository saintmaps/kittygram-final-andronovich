version: '3.8'

volumes:
  pg_data:
  static:
  media:

services:
  postgres:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: saintmaps/kittygram_backend:latest
    env_file: .env
    volumes:
      - static:/app/static/
      - media:/app/media/
    depends_on:
      - postgres

  frontend:
    image: saintmaps/kittygram_frontend:latest
    volumes:
      - static:/app/result_build/

  gateway:
    image: saintmaps/kittygram_gateway:latest
    ports:
      - "8000:80"
    volumes:
      - static:/staticfiles/
      - media:/app/media/
    depends_on:
      - backend
      - frontend